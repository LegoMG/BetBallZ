<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="container mt-5 pt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-4 p-4 bg-light border rounded shadow">
            <main class="form-signin w-100 m-auto">
                <form> <img class="mb-4" src="Imagenes/Logo.jpg" alt="" width="72" height="57">
                    <h1 class="h3 mb-3 fw-normal">Ingresa tus datos</h1>
                    <div class="form-floating"> <input type="email" class="form-control" id="floatingInput"
                            placeholder="name@example.com"> <label for="floatingInput">Gmail</label> </div>
                    <div class="form-floating"> <input type="password" class="form-control" id="floatingPassword"
                            placeholder="Password"> <label for="floatingPassword">Contraseña</label> </div>
                    <div class="form-check text-start my-3"> <input class="form-check-input" type="checkbox"
                            value="remember-me" id="checkDefault"> <label class="form-check-label" for="checkDefault">
                            Recordar
                        </label> </div> <button class="btn btn-primary w-100 py-2" type="button" id="miBotonPrueba">Ingresar</button>
                    <p class="mt-5 mb-3 text-body-secondary"></p>
                </form>
            </main>
        </div>
    </div>
</div>
<script>
    const boton = document.getElementById('miBotonPrueba');

    if (boton) {
        boton.addEventListener('click', function() {
            const correo = document.getElementById('floatingInput').value;
            const contrasena = document.getElementById('floatingPassword').value;

            if (correo === "" || contrasena === "") {
                alert("¡Ki insuficiente! Debes ingresar tu correo y contraseña.");
            } else {
                localStorage.setItem("sesionIniciada", "si");
                alert("¡Bienvenido a BetballZ!");
                window.location.href = "index.html"; 
            }
        });
    }
</script>
