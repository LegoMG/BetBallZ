<script>
    const haySesion = localStorage.getItem("sesionIniciada");

    const divVisitante = document.getElementById("botonesVisitante");
    const divUsuario = document.getElementById("menuUsuario");
    const sideVisitante = document.getElementById("sidebarVisitante");
    const sideUsuario = document.getElementById("sidebarUsuario");

    if (haySesion === "si") {
        if (divVisitante) divVisitante.classList.add("d-none");
        if (sideVisitante) sideVisitante.classList.add("d-none");
    
        if (divUsuario) divUsuario.classList.remove("d-none");
        if (sideUsuario) sideUsuario.classList.remove("d-none");
    }

    function cerrarSesion() {
        localStorage.removeItem("sesionIniciada");
        window.location.reload();
    }
    const btnSalirArriba = document.getElementById("btnCerrarSesion");
    if (btnSalirArriba) {
        btnSalirArriba.addEventListener('click', cerrarSesion);
    }

    const btnSalirSide = document.getElementById("btnCerrarSesionSidebar");
    if (btnSalirSide) {
        btnSalirSide.addEventListener('click', cerrarSesion);
    }
</script>
