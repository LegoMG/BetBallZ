<html lang="es" data-bs-theme="dark">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · BetBallZ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css?v=2">

  <nav class="navbar navbar-dbz fixed-top" x-data>
    <div class="container-fluid gap-2">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- El buscador manda a Planeta.html?q=... y allí Alpine filtra -->
      <form class="d-flex flex-grow-1 flex-md-grow-0 mx-md-auto" role="search" data-bs-theme="light" action="Planeta.html" method="get">
        <input class="form-control me-2" type="search" name="q" placeholder="Buscar juegos" aria-label="Buscar juegos">
        <button class="btn btn-dark btn-buscar" type="submit">Buscar</button>
      </form>

      <!-- Visitante -->
      <div x-show="!$store.sesion.activa" x-cloak>
        <div class="d-none d-sm-flex">
          <a class="btn btn-outline-light me-2" href="Iniciar.html">Iniciar sesión</a>
          <a class="btn btn-light fw-bold text-dark" href="Registrar.html">Registrarse</a>
        </div>
      </div>
      <!-- Usuario con sesión -->
      <div x-show="$store.sesion.activa" x-cloak>
        <div class="d-none d-sm-flex align-items-center">
          <span class="text-white me-3 fw-bold" id="saludo">Hola, <span x-text="$store.sesion.nombre"></span></span>
          <button class="btn btn-danger btn-sm" type="button" @click="$store.sesion.cerrar()">Salir</button>
        </div>
      </div>

      <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">BetBallZ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav flex-grow-1 pe-3">
            <li class="nav-item"><a class="nav-link " href="index.html">Lobby (Inicio)</a></li>
            <li class="nav-item"><a class="nav-link " href="Planeta.html">Planetas de Juegos</a></li>
            <li class="nav-item"><a class="nav-link " href="boveda.html">Bóveda de Zeni (Recargas)</a></li>
            <hr>
            <li class="nav-item" x-show="!$store.sesion.activa" x-cloak>
              <a class="btn btn-outline-warning w-100 mt-2" href="Iniciar.html">Iniciar sesión</a>
              <a class="btn btn-outline-light w-100 mt-2" href="Registrar.html">Registrarse</a>
            </li>
            <li class="nav-item" x-show="$store.sesion.activa" x-cloak>
              <button class="btn btn-outline-danger w-100 mt-2" type="button" @click="$store.sesion.cerrar()">Cerrar sesión</button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container mt-5 pt-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4" x-data="formLogin()">
        <form class="panel-bz p-4 text-center" @submit.prevent="enviar()" novalidate>
          <img class="mb-3 rounded-circle" src="Imagenes/Logo.jpg" alt="Logo BetBallZ" width="72" height="72">
          <h1 class="h3 mb-3 fw-normal">Ingresa tus datos</h1>

          <div class="alert alert-danger py-2 small" role="alert" x-show="error" x-text="error" x-cloak></div>

          <div class="form-floating mb-2">
            <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" x-model="correo" autocomplete="username">
            <label for="correo">Correo</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="clave" placeholder="Contraseña" x-model="clave" autocomplete="current-password">
            <label for="clave">Contraseña</label>
          </div>
          <button class="btn btn-bz w-100 py-2" type="submit">Ingresar</button>
          <p class="small text-secondary mt-3 mb-0">Sesión simulada: solo se recuerda en este navegador. No es autenticación real.</p>
          <p class="small mt-2 mb-0">¿No tienes cuenta? <a class="link-warning" href="Registrar.html">Regístrate</a></p>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</html>
